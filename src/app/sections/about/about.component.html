<section id="sobre" class="section" aria-labelledby="sobre-title">
  <div class="stage">
    <h2 id="sobre-title" class="title" appReveal>
      <span>{{ content.title.start }} </span>
      <em>{{ content.title.em }}</em>
    </h2>
    <figure class="arch" appImageMask>
      <img
        class="mask-inner"
        [ngSrc]="photo.base + '-' + photo.width"
        [ngSrcset]="ngSrcset"
        [sizes]="sizes"
        [width]="photo.width"
        [height]="photo.height"
        [alt]="photo.alt"
      />
    </figure>
  </div>

  <div class="container grid">
    <dl class="facts" appReveal [revealChildren]="true">
      @for (fact of facts; track fact.label) {
        <div>
          <dt>{{ fact.label }}</dt>
          @for (value of fact.values; track value) {
            <dd>{{ value }}</dd>
          }
        </div>
      }
    </dl>

    <div class="text">
      <p class="first" appSplitText>{{ content.lead }}</p>
      <div class="rest" appReveal [revealChildren]="true">
        @for (paragraph of content.paragraphs; track $index) {
          <p>{{ paragraph }}</p>
        }
      </div>
    </div>
  </div>
</section>
