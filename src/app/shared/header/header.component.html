<header class="header" [class.is-open]="menuOpen()" (keydown)="trapFocus($event)">
  <a class="brand" href="/#inicio" (click)="goTo($event, 'inicio')">
    <app-seal class="seal" />
    <span class="brand-text">
      <img src="images/simbolo-iara.webp" width="139" height="112" alt="" />
      <span>
        <span class="brand-name">{{ pro.name }}</span>
        <span class="brand-role"><span>{{ pro.role }} · </span>{{ pro.crp }}</span>
      </span>
    </span>
  </a>

  <div class="pill">
    <nav class="nav" aria-label="Seções do site">
      <ul role="list">
        @for (item of nav; track item.id) {
          <li>
            <a class="nav-link" [href]="'/#' + item.id" (click)="goTo($event, item.id)">{{ item.label }}</a>
          </li>
        }
      </ul>
    </nav>
    <a class="btn cta" href="/#contato" (click)="goTo($event, 'contato')">Agendar conversa</a>
    <button
      #menuButton
      type="button"
      class="menu-btn"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="menu-mobile"
      (click)="toggleMenu()"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" />
      {{ menuOpen() ? 'Fechar' : 'Menu' }}
    </button>
  </div>

  <div #menuPanel id="menu-mobile" class="menu on-dark" [hidden]="!menuOpen()">
    <nav aria-label="Seções do site (menu)">
      <ul role="list">
        @for (item of nav; track item.id; let i = $index) {
          <li [style.--i]="i">
            <a class="menu-link" [href]="'/#' + item.id" (click)="goTo($event, item.id)">{{ item.label }}</a>
          </li>
        }
      </ul>
    </nav>
    <div class="menu-actions">
      <a class="btn btn--light" href="/#contato" (click)="goTo($event, 'contato')">Agendar conversa</a>
    </div>
  </div>
</header>

<div class="rail" appScrollProgress aria-hidden="true">
  <span class="rail-line"><span class="rail-value" data-progress-label>00</span></span>
  <span class="rail-label">Role</span>
</div>
